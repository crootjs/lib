# Setiap push dan pull request: jalankan tests/index.html di Chromium headless.
# Setiap push ke main yang lolos uji: buat tag dan GitHub Release dari CHANGELOG.md
# (tools/release.py) - hanya kalau versi teratasnya belum punya tag/release.
# Playwright (Python) hanya dipakai untuk menjalankan uji; pengguna CrootJS tetap tanpa npm.
name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang Playwright dan Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Jalankan uji
        run: python tests/run.py

  release:
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag dan GitHub Release dari CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          python3 tools/release.py
