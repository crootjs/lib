# Setiap push dan pull request: jalankan tests/index.html di Chromium, Firefox, dan WebKit headless.
# Setiap push ke main yang lolos uji: kalau kode modul berubah tanpa entri CHANGELOG baru, versi
# patch dibuat otomatis (tools/auto-version.py); lalu tag dan GitHub Release dari CHANGELOG.md
# (tools/release.py) - hanya kalau versi teratasnya belum punya tag/release. Kalau versi baru
# dibuat: tunggu jsDelivr, naikkan pin di README repo ini, tulis versinya ke version.json (tayang
# di croot.js.org/lib/version.json, dibaca landing page), lalu kirim repository_dispatch
# "lib-released" ke crootjs/docs, crootjs/examples, dan crootjs/crootjs.github.io, yang menaikkan
# pin, membangun ulang sitemap/llms-full, menjalankan uji live, dan mengirim notifikasi.
# Playwright (Python) hanya dipakai untuk menjalankan uji; pengguna CrootJS tetap tanpa npm.
name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # Image resmi Playwright sudah berisi ketiga browser beserta pustaka sistemnya. Memasang
    # WebKit dengan --with-deps di runner biasa beberapa kali macet di apt sampai batas 10 menit.
    container: mcr.microsoft.com/playwright/python:v1.65.2-noble
    env:
      HOME: /root  # Firefox menolak jalan sebagai root kalau HOME milik pengguna lain
    steps:
      - uses: actions/checkout@v7
      - name: Pasang Playwright
        run: pip install --break-system-packages playwright==1.65.2
      - name: Jalankan uji
        run: python tests/run.py ${{ matrix.browser }}

  release:
    needs: browser
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30  # termasuk menunggu jsDelivr
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Kode modul berubah tanpa entri CHANGELOG baru: versi patch dinaikkan otomatis dari judul
      # commit. Entri yang ditulis tangan selalu diutamakan (lihat tools/auto-version.py).
      - name: Versi patch otomatis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          python3 tools/auto-version.py
      - name: Tag dan GitHub Release dari CHANGELOG.md
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          python3 tools/release.py

      # Sisanya hanya kalau push ini membuat versi baru.
      - name: Tunggu jsDelivr menyajikan versi baru
        if: steps.release.outputs.released
        env:
          VERSION: ${{ steps.release.outputs.released }}
        run: |
          # File .min.js dibuat jsDelivr saat pertama diminta dan sempat 404 beberapa menit.
          for i in $(seq 1 60); do
            js=$(curl -s -o /dev/null -w '%{http_code}' "https://cdn.jsdelivr.net/gh/crootjs/lib@$VERSION/api.js")
            min=$(curl -s -o /dev/null -w '%{http_code}' "https://cdn.jsdelivr.net/gh/crootjs/lib@$VERSION/api.min.js")
            echo "api.js $js, api.min.js $min"
            [ "$js$min" = "200200" ] && exit 0
            sleep 20
          done
          echo "jsDelivr belum menyajikan lib@$VERSION setelah 20 menit" >&2
          exit 1

      - name: Pastikan semua file .min tersedia di jsDelivr
        if: steps.release.outputs.released
        env:
          VERSION: ${{ steps.release.outputs.released }}
        run: |
          # jsDelivr bisa menyimpan jawaban 404 untuk file yang diminta sebelum tag ada (misalnya
          # dari docs/contoh yang sudah memakai versi baru). File seperti itu di-purge lalu dicek lagi.
          failed=""
          for file in $(ls *.js | grep -v '\.min\.js$' | sed 's/\.js$/.min.js/') $(ls *.css | grep -v '\.min\.css$' | sed 's/\.css$/.min.css/') integrity.json; do
            url="https://cdn.jsdelivr.net/gh/crootjs/lib@$VERSION/$file"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            # Memperkecil file butuh waktu, dan selama itu jawabannya bisa 404: purge, lalu coba
            # lagi sampai sekitar satu menit.
            for attempt in 1 2 3 4 5 6; do
              [ "$code" = 200 ] && break
              curl -s -o /dev/null "https://purge.jsdelivr.net/gh/crootjs/lib@$VERSION/$file"
              sleep 10
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            done
            echo "$file $code"
            [ "$code" = 200 ] || failed="$failed $file"
          done
          if [ -n "$failed" ]; then
            echo "::warning::Belum tersedia di jsDelivr:$failed"
          fi

      - name: Naikkan pin di repo ini dan umumkan versinya
        if: steps.release.outputs.released
        env:
          VERSION: ${{ steps.release.outputs.released }}
        run: |
          python3 tools/bump-pins.py "$VERSION"
          # Ditulis setelah jsDelivr siap, jadi yang membaca file ini tidak pernah mendapat versi
          # yang masih 404.
          echo "{\"version\": \"$VERSION\"}" > version.json
          git add version.json
          git commit -am "bump pins to lib@$VERSION"
          # Push dengan GITHUB_TOKEN tidak memicu workflow ini lagi, tetapi tetap membangun Pages.
          git push origin HEAD:main

      - name: Beri tahu docs, examples, dan landing page
        if: steps.release.outputs.released
        env:
          VERSION: ${{ steps.release.outputs.released }}
          # Fine-grained token dengan Contents: read and write di ketiga repo itu.
          GH_TOKEN: ${{ secrets.CROOTJS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Secret CROOTJS_DISPATCH_TOKEN belum dipasang; jalankan bump-pins/release di docs, examples, dan landing page dari tab Actions."
            exit 0
          fi
          for repo in docs examples crootjs.github.io; do
            gh api "repos/crootjs/$repo/dispatches" -f event_type=lib-released -f "client_payload[version]=$VERSION"
            echo "crootjs/$repo diberi tahu"
          done
